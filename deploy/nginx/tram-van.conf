# Include this file inside nginx's http {} block (e.g. /etc/nginx/conf.d/).
# cloudflared runs on the same host and connects to http://127.0.0.1:80.
# Replace tram-van.example.com with the public hostname of the tunnel.

# Versioned Vite bundles can be cached for a year. Mutable media use a short TTL.
# Never cache errors or redirects, even when the URL looks like a static asset.
map "$status:$uri" $tram_van_cache_control {
    default                              "no-store";
    ~^(200|206|304):/assets/              "public, max-age=31536000, immutable";
    ~^(200|206|304):/memories/            "public, max-age=3600, must-revalidate";
    ~^(200|304):/                        "no-cache";
}

log_format tram_van '$remote_addr [$time_local] "$request" $status '
                    '$body_bytes_sent rt=$request_time '
                    'peer=$realip_remote_addr cf_ray="$http_cf_ray"';

server {
    listen 127.0.0.1:80;
    listen [::1]:80;
    server_name tram-van.example.com;

    root /var/www/tram-van/app;
    index index.html;
    autoindex off;
    server_tokens off;
    absolute_redirect off;

    # Only a local cloudflared connector may supply the client's real IP.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/tram-van.access.log tram_van buffer=32k flush=5s;
    error_log /var/log/nginx/tram-van.error.log warn;

    # Include at server scope so the extra mappings extend this complete table.
    # .mjs MUST be JavaScript: the PDF worker is an ES module.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
        video/ogg ogv;
    }
    default_type application/octet-stream;

    sendfile on;
    sendfile_max_chunk 2m;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    etag on;
    expires off;

    # Compress text only. MP4, PDF, DOCX and WebP are already compressed.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml application/wasm;

    # Keep headers at server scope; add_header in a location would replace them
    # on nginx versions using the standard header-inheritance rules.
    add_header Cache-Control $tram_van_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' blob:" always;

    # Do not expose hidden files, even inside the media directory.
    location ~ (^|/)\. {
        return 404;
    }

    location = /memories {
        return 308 /memories/;
    }

    # /memories/foo.pdf -> /var/www/tram-van/memories/foo.pdf.
    # Native static-file serving provides Accept-Ranges and 206 responses.
    location /memories/ {
        root /var/www/tram-van;
        try_files $uri =404;
        gzip off;
        max_ranges 1;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # This application has no path-based client router. Missing URLs return 404;
    # in particular missing scripts/media must never receive index.html.
    location / {
        try_files $uri $uri/ =404;
    }
}
